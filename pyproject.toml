[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aqf"
version = "0.1.0"
description = "Multi-source PM2.5 forecasting for Delhi-NCR: CPCB stations + GFS weather + VIIRS stubble fires, with TFT and a wind-aware graph network"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "pyyaml>=6",
  "requests>=2.31",
  "scikit-learn>=1.3",
  "lightgbm>=4.1",
  "torch>=2.2",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
download = ["eccodes>=2.37", "netCDF4>=1.6"]
app = ["streamlit>=1.50"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
aqf = "aqf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B023", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
